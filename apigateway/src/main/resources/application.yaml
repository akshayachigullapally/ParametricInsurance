server:
  port: 8080

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: API-GATEWAY

eureka:
  client:
    # Pick up restarted services within seconds instead of ~30 s.
    registry-fetch-interval-seconds: 5
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

jwt:
  secret: ${JWT_SECRET:CityShieldAuthServiceDevelopmentSecretKeyMinimum32Characters123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield API Gateway
    description: CityShield microservices gateway
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.apigateway: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
  file:
    name: ./logs/api-gateway.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
