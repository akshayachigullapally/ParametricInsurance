server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

jwt:
  secret: ${JWT_SECRET:CityShieldAuthServiceDevelopmentSecretKeyMinimum32Characters123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  application:
    name: CityShield API Gateway
    description: CityShield microservices gateway
    version: 1.0.0

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO