server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE
  r2dbc:
    # The connection is built by AuthDatabaseConfig from auth.db.dir below.
    username: sa
    password:
  data:
    r2dbc:
      repositories:
        enabled: true
#spring:
#  application:
#    name: AUTH-SERVICE
#  r2dbc:
#    url:r2dbc:mysql://localhost:3306/authService
#    username: root
#    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

auth:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${AUTH_DB_DIR:${user.home}/.cityshield/data}

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

jwt:
  secret: ${JWT_SECRET:CityShieldAuthServiceDevelopmentSecretKeyMinimum32Characters123456}
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

email:
  verification-token-expiration-hours: 24

password:
  reset-token-expiration-hours: 1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Auth Service
    description: Reactive JWT authentication service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.authservice: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
  file:
    name: ${LOG_DIR:${user.home}/.cityshield/logs}/auth-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
