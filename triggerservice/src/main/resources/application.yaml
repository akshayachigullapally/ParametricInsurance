spring:
  application:
    name: TRIGGER-SERVICE

  r2dbc:
    url: r2dbc:h2:file:///./data/triggerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8087

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

demo:
  feed:
    enabled: ${DEMO_FEED_ENABLED:true}
    interval-ms: ${DEMO_FEED_INTERVAL_MS:60000}
    backfill-hours: 24


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Trigger Service
    description: Parametric trigger definition, observation and event evaluation service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.triggerservice: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ./logs/trigger-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
