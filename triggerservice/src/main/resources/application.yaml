spring:
  application:
    name: TRIGGER-SERVICE

  r2dbc:
    # Connection built by PersistentDatabaseConfig from app.db.* below.
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8087

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

demo:
  feed:
    enabled: ${DEMO_FEED_ENABLED:true}
    interval-ms: ${DEMO_FEED_INTERVAL_MS:60000}
    backfill-hours: 24

app:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${CITYSHIELD_DB_DIR:${user.home}/.cityshield/data}
    name: triggerdb

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Trigger Service
    description: Parametric trigger definition, observation and event evaluation service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.triggerservice: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_DIR:${user.home}/.cityshield/logs}/trigger-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
