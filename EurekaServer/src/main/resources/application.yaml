spring:
  application:
    name: EUREKA-SERVER

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Eureka Server
    description: Service discovery registry
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.eurekaserver: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ./logs/eureka-server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
