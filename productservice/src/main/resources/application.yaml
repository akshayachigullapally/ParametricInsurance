server:
  port: 8082

spring:
  application:
    name: PRODUCT-SERVICE
  r2dbc:
    # Connection built by PersistentDatabaseConfig from app.db.* below.
    username: sa
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}
  require-gateway-key: ${GATEWAY_REQUIRE_KEY:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.h2: DEBUG

app:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${CITYSHIELD_DB_DIR:${user.home}/.cityshield/data}
    name: productdb
