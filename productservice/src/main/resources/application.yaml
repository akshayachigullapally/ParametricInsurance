server:
  port: 8082

spring:
  application:
    name: PRODUCT-SERVICE
  r2dbc:
    url: r2dbc:h2:file:///./data/productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}
  require-gateway-key: ${GATEWAY_REQUIRE_KEY:false}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Product Service
    description: Insurance product and policy management service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.productservice: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.h2: DEBUG
  file:
    name: ./logs/product-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
