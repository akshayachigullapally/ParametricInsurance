eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

spring:
  application:
    name: FINANCIAL-SERVICE-TEST

  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  cloud:
    service-registry:
      auto-registration:
        enabled: false
    loadbalancer:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  internal-key: climatesure-local-gateway-key