server:
  port: 8088

spring:
  application:
    name: FINANCIAL-SERVICE

  r2dbc:
    url: r2dbc:h2:mem:///financialdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:

  sql:
    init:
      mode: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

financial:
  quote:
    expiry-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info