server:
  port: 8088

spring:
  application:
    name: FINANCIAL-SERVICE

  r2dbc:
    # Connection built by PersistentDatabaseConfig from app.db.* below.
    username: sa
    password:

  sql:
    init:
      mode: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

financial:
  quote:
    expiry-days: 7

app:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${CITYSHIELD_DB_DIR:${user.home}/.cityshield/data}
    name: financialdb

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Financial Service
    description: Quotes, payments, payouts and pricing service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.financialservice: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_DIR:${user.home}/.cityshield/logs}/financial-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
