server:
  port: 8083

spring:
  application:
    name: CLAIMS-SERVICE
  r2dbc:
    url: r2dbc:h2:file:///./data/claimsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

app:
  uploads:
    # Claim evidence files (photos / PDFs). Metadata is in claim_documents.
    dir: ${CITYSHIELD_UPLOAD_DIR:${user.home}/.cityshield/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Claims Service
    description: Reactive insurance claim management service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.claimsservice: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.r2dbc: INFO
    org.springframework.security: INFO
  file:
    name: ${LOG_DIR:${user.home}/.cityshield/logs}/claims-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
