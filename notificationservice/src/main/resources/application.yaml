server:
  port: 8085

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: NOTIFICATION-SERVICE
  r2dbc:
    url: r2dbc:h2:file:///./data/notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    # Pick up restarted services within seconds instead of ~30 s.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Notification Service
    description: Notifications, delivery and audit event service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.notificationservice: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ./logs/notification-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
