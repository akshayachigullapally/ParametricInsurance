server:
  port: 8085

spring:
  application:
    name: NOTIFICATION-SERVICE
  r2dbc:
    # Connection built by PersistentDatabaseConfig from app.db.* below.
    username: sa
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}

app:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${CITYSHIELD_DB_DIR:${user.home}/.cityshield/data}
    name: notificationdb

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    name: CityShield Notification Service
    description: Notifications, delivery and audit event service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.notificationservice: ${APP_LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_DIR:${user.home}/.cityshield/logs}/notification-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
