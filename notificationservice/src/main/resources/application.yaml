server:
  port: 8085
spring:
  application:
    name: NOTIFICATION-SERVICE
  r2dbc:
    url: r2dbc:h2:mem:///notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost
gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info
