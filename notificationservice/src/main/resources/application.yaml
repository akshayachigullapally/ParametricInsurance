server:
  port: 8085
spring:
  application:
    name: NOTIFICATION-SERVICE
  r2dbc:
    # Connection built by PersistentDatabaseConfig from app.db.* below.
    username: sa
    password:
  sql:
    init:
      mode: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost
gateway:
  internal-key: ${GATEWAY_INTERNAL_KEY:cityshield-local-gateway-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  db:
    # Fixed location, independent of the folder the service is started from.
    # Keep it outside OneDrive/Dropbox-synced folders.
    dir: ${CITYSHIELD_DB_DIR:${user.home}/.cityshield/data}
    name: notificationdb
